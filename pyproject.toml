[project]
name = "rag-ingestion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.128.0",
    "markdownify>=1.2.2",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "uvicorn>=0.39.0",
    "neo4j>=5.17.0",
    "chromadb-client>=0.4.18",
    "python-dotenv>=1.0.1",
    "langchain>=0.3.0",
    "langchain-google-genai>=4.0.0",
    "onnxruntime>=1.16.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "ruff>=0.14.13",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings  
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
