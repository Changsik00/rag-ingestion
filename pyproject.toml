[project]
name = "rag-ingestion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.128.0",
    "markdownify>=1.2.2",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "uvicorn>=0.39.0",
    "neo4j==5.17.0",
    "chromadb>=0.4.18",
    "python-dotenv>=1.0.1",
    "langchain>=0.3.0",
    "langchain-google-genai>=4.0.0",
    "pydantic-settings>=2.12.0",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.6",
    "streamlit>=1.30.0",
    "streamlit-agraph>=0.0.45",
    "plotly>=5.18.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "trafilatura>=2.0.0",
    "mcp>=1.2.0",
    "aiosqlite>=0.20.0",
    "firecrawl-py>=4.13.4",
    "playwright>=1.57.0",
    "youtube-transcript-api>=1.2.3",
    "yt-dlp>=2025.12.8",
    "faster-whisper>=1.2.1",
    "pymupdf>=1.26.7",
    "python-magic>=0.4.27",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.13",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings  
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
