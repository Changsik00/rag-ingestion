version: '3.8'

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: rag-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - GEMINI_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - neo4j
      - chromadb

  streamlit:
    image: python:3.9-slim
    container_name: rag-admin
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - API_URL=http://backend:8000
    command: >
      sh -c "pip install streamlit requests pandas && streamlit run app/admin/dashboard.py"
    depends_on:
      - backend

volumes:
  neo4j_data:
  chroma_data:
