version: '3.8'

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: rag-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - NEO4J_URI=bolt://rag-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - CHROMA_HOST=rag-chroma
      - CHROMA_PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - neo4j
      - chromadb

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: rag-admin
    ports:
      - "8501:8501"
    volumes:
      - ./admin:/app/admin
    environment:
      - ADMIN_API_URL=http://rag-backend:8000/api/v1/admin
      - PYTHONPATH=/app
    command: ["uv", "run", "streamlit", "run", "admin/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]

volumes:
  neo4j_data:
  chroma_data:
